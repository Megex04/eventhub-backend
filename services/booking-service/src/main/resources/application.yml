spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  # Connection settings come from the environment; the password has no default on purpose.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    # Optional fields (confirmedAt, cancelReason, payment) are absent rather than null.
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are discovered from the issuer (lazily, on the first token). No default on purpose.
          issuer-uri: ${OIDC_ISSUER_URI}
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8082

# Tunables of the service (see BookingProperties). Validated at startup: a bad value stops it.
eventhub:
  booking:
    hold-duration: 10m
    max-tickets: 6
    expiration:
      batch-size: 50
      poll-interval: 30s
    reconciler:
      initiated-stale-after: 5m
      initial-backoff: 30s
      max-backoff: 10m
      batch-size: 20
      poll-interval: 1m
    cascade:
      batch-size: 50

management:
  server:
    # Actuator on its own port, away from the public API. The local and test profiles put it
    # back on the server port so it is easy to reach and to test.
    port: 8083
  tracing:
    # traceId/spanId reach the logging context and the problem+json bodies. Nothing is exported
    # unless an operator turns an exporter on and gives it an endpoint.
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

# Structured JSON logs (traceId/correlationId are added via MDC).
logging:
  structured:
    format:
      console: logstash
