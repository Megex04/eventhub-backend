# Local development profile: points at the docker-compose services.
# Export POSTGRES_PASSWORD (see .env.example) before running; it deliberately has no default here.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:catalog}
    username: ${POSTGRES_USER:eventhub}
    password: ${POSTGRES_PASSWORD}

management:
  endpoint:
    health:
      show-details: always
