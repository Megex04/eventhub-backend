spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

# Structured JSON logs (traceId/correlationId are added via MDC in later milestones).
logging:
  structured:
    format:
      console: logstash
