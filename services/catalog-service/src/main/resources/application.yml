spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  # Connection settings come from the environment; the password has no default on purpose.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    # Optional fields (description, cancelReason) are absent rather than null, as the contract says.
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are discovered from the issuer (lazily, on the first token). No default on purpose.
          issuer-uri: ${OIDC_ISSUER_URI}
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

# Structured JSON logs (traceId/correlationId are added via MDC in later milestones).
logging:
  structured:
    format:
      console: logstash
