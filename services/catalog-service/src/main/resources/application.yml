spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  # Connection settings come from the environment; the password has no default on purpose.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    # Optional fields (description, cancelReason) are absent rather than null, as the contract says.
    default-property-inclusion: non_null
  # Broker connection comes from the environment; credentials have no default on purpose.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # The relay marks a row published only after the broker confirmed it.
    publisher-confirm-type: correlated
    # An unresponsive broker must fail an attempt, not hang the relay while it holds row locks.
    connection-timeout: 5s
    channel-rpc-timeout: 5s
  cloud:
    stream:
      bindings:
        outbox-out-0:
          destination: eventhub.events
      rabbit:
        bindings:
          outbox-out-0:
            producer:
              exchange-type: topic
              # <service>.<aggregate>.<event>.v<version>, set per message by the relay.
              routing-key-expression: headers['routingKey']
              use-confirm-header: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are discovered from the issuer (lazily, on the first token). No default on purpose.
          issuer-uri: ${OIDC_ISSUER_URI}
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Outbox relay (see OutboxProperties). The poller can be switched off with enabled: false.
eventhub:
  outbox:
    enabled: true
    batch-size: 50
    poll-interval: 1s
    max-attempts: 10
    initial-backoff: 2s
    max-backoff: 5m
    confirm-timeout: 5s

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

# Structured JSON logs (traceId/correlationId are added via MDC in later milestones).
logging:
  structured:
    format:
      console: logstash
